<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102541"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3a0"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f0a500"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity=".55"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Subtle glass border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14"
        fill="none" stroke="#2c68a8" stroke-width="1.5" opacity=".65"/>

  <!-- Clapperboard -->
  <g filter="url(#shadow)" filter="url(#glow)">
    <!-- Body -->
    <rect x="14" y="27" width="36" height="25" rx="5"
          fill="url(#gold)" stroke="#fff0a0" stroke-width="1"/>

    <!-- Top clapper -->
    <path d="M13 25.5 L50 17.5 L52 27 L15 35 Z"
          fill="url(#gold)" stroke="#fff0a0" stroke-width="1"/>

    <!-- Clapper stripes -->
    <path d="M19 24.2 L24.5 23 L21.5 30.2 L16 31.4 Z"
          fill="#0a1628"/>
    <path d="M29 22 L34.5 20.8 L31.5 28 L26 29.2 Z"
          fill="#0a1628"/>
    <path d="M39 19.8 L44.5 18.6 L41.5 25.8 L36 27 Z"
          fill="#0a1628"/>

    <!-- Play symbol -->
    <path d="M29 34 L29 45 L40 39.5 Z"
          fill="#0a1628"/>
  </g>

  <!-- Highlight -->
  <path d="M19 40 Q19 32 27 31"
        fill="none" stroke="#fff7c4" stroke-width="1.2"
        stroke-linecap="round" opacity=".65"/>
</svg>