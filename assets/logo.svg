<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132d4d"/>
      <stop offset="45%" stop-color="#0d2038"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6a8"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#ffc400"/>
      <stop offset="100%" stop-color="#f0a500"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d98d00"/>
    </linearGradient>

    <radialGradient id="lens">
      <stop offset="0%" stop-color="#fff8bd"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e89c00"/>
    </radialGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7"
                    flood-color="#000000" flood-opacity=".6"/>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="42" fill="url(#bg)"/>

  <!-- Glass border -->
  <rect x="3" y="3" width="194" height="194" rx="39"
        fill="none" stroke="#2b6ba9" stroke-width="3" opacity=".7"/>

  <!-- Glass highlight -->
  <path d="M32 70 Q35 30 76 23"
        fill="none" stroke="#ffffff" stroke-width="3"
        stroke-linecap="round" opacity=".08"/>

  <!-- Film reels -->
  <g filter="url(#shadow)">
    <!-- Rear reel -->
    <circle cx="72" cy="52" r="27" fill="url(#gold)"/>
    <circle cx="72" cy="52" r="20" fill="#e9a600"/>

    <!-- Rear reel holes -->
    <g fill="#0a1628">
      <circle cx="72" cy="39" r="5"/>
      <circle cx="84" cy="47" r="5"/>
      <circle cx="80" cy="61" r="5"/>
      <circle cx="64" cy="64" r="5"/>
      <circle cx="59" cy="49" r="5"/>
    </g>

    <circle cx="72" cy="52" r="5" fill="#ffd700"/>

    <!-- Front reel -->
    <circle cx="105" cy="46" r="30" fill="url(#gold)"/>
    <circle cx="105" cy="46" r="22" fill="#eda900"/>

    <g fill="#0a1628">
      <circle cx="105" cy="32" r="5.5"/>
      <circle cx="118" cy="40" r="5.5"/>
      <circle cx="114" cy="55" r="5.5"/>
      <circle cx="97" cy="59" r="5.5"/>
      <circle cx="91" cy="43" r="5.5"/>
    </g>

    <circle cx="105" cy="46" r="5" fill="#ffd700"/>
  </g>

  <!-- Camera body -->
  <g filter="url(#shadow)">
    <rect x="52" y="75" width="91" height="58" rx="9"
          fill="url(#gold)" stroke="#fff1a0" stroke-width="2"/>

    <!-- Camera top -->
    <path d="M66 75 L77 63 L102 63 L113 75 Z"
          fill="url(#goldDark)"/>

    <!-- Camera lens -->
    <path d="M143 84 L170 72 L170 121 L143 110 Z"
          fill="url(#gold)" stroke="#fff1a0" stroke-width="2"/>

    <!-- Lens inner -->
    <path d="M164 84 L164 109 L150 103 L150 90 Z"
          fill="#d99300" opacity=".65"/>

    <!-- Body highlight -->
    <path d="M61 84 H132"
          stroke="#fff8bd" stroke-width="3"
          stroke-linecap="round" opacity=".65"/>

    <!-- Lens ring -->
    <rect x="138" y="87" width="9" height="30" rx="3"
          fill="#e09a00"/>
  </g>

  <!-- Camera stand -->
  <g fill="url(#gold)" filter="url(#shadow)">
    <path d="M90 133 L100 133 L85 166 L78 166 Z"/>
    <path d="M100 133 L108 133 L123 166 L116 166 Z"/>
    <path d="M94 133 L103 133 L102 166 L95 166 Z"/>
  </g>

  <!-- Stand joint -->
  <circle cx="99" cy="135" r="7"
          fill="#ffd700" stroke="#fff3a0" stroke-width="2"/>

  <!-- Glow accents -->
  <circle cx="105" cy="46" r="3"
          fill="#fffbd5" filter="url(#glow)"/>
</svg>