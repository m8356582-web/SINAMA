<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - صفحه یافت نشد | سینما</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #152a4a 0%, #0a1628 45%, #050a14 100%);
            color: #e8eef7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

            body::before {
                content: '';
                position: fixed;
                inset: 0;
                background: radial-gradient(circle at 15% 20%, rgba(255, 215, 0, .08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(26, 74, 138, .2) 0%, transparent 50%);
                pointer-events: none;
            }

        .container {
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease;
        }

        .error-code {
            font-size: 180px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #f0a500, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 0 80px rgba(255, 215, 0, .3);
            animation: float 3s ease-in-out infinite;
        }

        .icon {
            font-size: 80px;
            color: #ffd700;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, .5));
            animation: float 3s ease-in-out infinite;
            animation-delay: -1.5s;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #ffd700;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255, 215, 0, .3);
        }

        p {
            font-size: 16px;
            opacity: 0.7;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            font-family: 'Vazirmatn', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1a4a8a, #2a6ab0);
            box-shadow: 0 4px 15px rgba(26, 74, 138, .4);
        }

            .btn-primary:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 35px rgba(42, 106, 176, .6);
            }

        .btn-warning {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(255, 215, 0, .3);
        }

            .btn-warning:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 35px rgba(255, 215, 0, .6);
            }

        .btn-glass {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .1);
            backdrop-filter: blur(10px);
        }

            .btn-glass:hover {
                background: rgba(255, 255, 255, .15);
                transform: translateY(-3px);
            }

        .suggestions {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 215, 0, .1);
        }

            .suggestions h3 {
                font-size: 16px;
                color: #ffd700;
                margin-bottom: 15px;
                opacity: 0.8;
            }

        .suggestions-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

            .suggestions-links a {
                color: rgba(255, 255, 255, .6);
                text-decoration: none;
                font-size: 14px;
                padding: 8px 16px;
                border-radius: 30px;
                transition: all .3s;
                border: 1px solid transparent;
            }

                .suggestions-links a:hover {
                    color: #ffd700;
                    background: rgba(255, 215, 0, .08);
                    border-color: rgba(255, 215, 0, .2);
                }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 120px;
            }

            .icon {
                font-size: 60px;
            }

            h1 {
                font-size: 22px;
            }

            p {
                font-size: 14px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">
            <i class="fas fa-film"></i>
        </div>

        <div class="error-code">404</div>

        <h1>🎬 صفحه یافت نشد!</h1>

        <p>
            به نظر می‌رسد این صفحه مثل یه فیلم گمشده توی آرشیو سینماست! 🎞️<br>
            شاید آدرس اشتباه وارد شده یا صفحه حذف شده باشد.
        </p>

        <div class="buttons">
            <a href="./index.html" class="btn btn-warning">
                <i class="fas fa-home"></i> بازگشت به خانه
            </a>
            <a href="javascript:history.back()" class="btn btn-glass">
                <i class="fas fa-arrow-right"></i> بازگشت
            </a>
        </div>

        <div class="suggestions">
            <h3>شاید دنبال این صفحات هستید:</h3>
            <div class="suggestions-links">
                <a href="./index.html#movies">🎬 فیلم‌ها</a>
                <a href="./index.html#showtimes">📅 برنامه اکران</a>
                <a href="./index.html#leaderboard">🏆 برترین‌ها</a>
                <a href="./index.html#profile">👤 پروفایل</a>
            </div>
        </div>
    </div>

</body>
</html>
